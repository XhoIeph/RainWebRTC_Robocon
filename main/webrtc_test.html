<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Robot Cam — 双路</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:Arial,sans-serif;padding:8px;display:flex;flex-direction:column;align-items:center}
#videos{display:flex;gap:6px;width:100%;max-width:800px;flex-wrap:wrap;justify-content:center}
.camBox{flex:1;min-width:280px;max-width:400px;background:#111;border-radius:10px;overflow:hidden;position:relative}
.camBox .label{position:absolute;top:4px;left:8px;z-index:2;color:#fff;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:8px;font-size:11px}
.camBox video{width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;display:block}
.camBox .camSt{position:absolute;bottom:4px;right:8px;z-index:2;font-size:10px;padding:2px 6px;border-radius:6px;background:#555;color:#fff}
.camSt.ok{background:#27ae60}
.camSt.err{background:#e74c3c}
.ctrlPanel{width:100%;max-width:400px;background:#1a1a2e;border-radius:10px;margin:8px 0;padding:10px 14px}
.ctrlPanel h3{color:#ccc;font-size:13px;cursor:pointer;user-select:none;margin:0 0 8px}
.ctrlPanel h3 .arrow{display:inline-block;transition:transform .3s}
.ctrlPanel.collapsed .ctrlBody{display:none}
.ctrlPanel.collapsed .arrow{transform:rotate(-90deg)}
.ctrlBody{display:flex;flex-direction:column;gap:8px}
.ctrlRow{display:flex;flex-direction:column;gap:3px}
.ctrlRow label{color:#aaa;font-size:11px;display:flex;justify-content:space-between}
.ctrlRow label span{color:#fff;font-weight:bold}
.ctrlRow input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:3px;background:#333;outline:none}
.ctrlRow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#27ae60;cursor:pointer}
.toggleRow{display:flex;align-items:center;justify-content:space-between}
.toggleRow label{color:#aaa;font-size:11px}
.toggle-btn{padding:5px 12px;border:none;border-radius:14px;font-size:11px;cursor:pointer;font-weight:bold}
.toggle-on{background:#27ae60;color:#fff}
.toggle-off{background:#e74c3c;color:#fff}
#log{color:#666;font-size:10px;text-align:center;margin:4px;word-break:break-all;max-height:30px;overflow:hidden}
@media(max-width:600px){#videos{flex-direction:column}.camBox{max-width:100%}}
</style>
</head>
<body>
<div id="videos">
  <div class="camBox" id="boxA">
    <div class="label">📷 相机A (主机)</div>
    <video id="vA" autoplay playsinline muted></video>
    <div class="camSt" id="stA">等待</div>
  </div>
  <div class="camBox" id="boxB">
    <div class="label">📷 相机B (从机)</div>
    <video id="vB" autoplay playsinline muted></video>
    <div class="camSt" id="stB">等待</div>
  </div>
</div>

<div id="camCtrl" class="ctrlPanel collapsed">
  <h3 onclick="togglePanel('camCtrl')"><span class="arrow">▼</span> 📷 相机A控制</h3>
  <div class="ctrlBody" id="camBody"></div>
</div>

<div id="encCtrl" class="ctrlPanel collapsed">
  <h3 onclick="togglePanel('encCtrl')"><span class="arrow">▼</span> 🎬 相机A编码</h3>
  <div class="ctrlBody">
    <div class="ctrlRow">
      <label>码率 <span id="v_bitrate">6</span> Mbps</label>
      <input type="range" id="s_bitrate" min="2" max="15" step="1" value="6" oninput="onEncVal('bitrate',this.value)">
    </div>
    <div class="ctrlRow">
      <label>GOP <span id="v_gop">15</span> 帧</label>
      <input type="range" id="s_gop" min="5" max="60" step="1" value="15" oninput="onEncVal('gop',this.value)">
    </div>
    <div class="ctrlRow">
      <button class="toggle-btn toggle-on" onclick="forceIDR()" style="width:100%;padding:8px">⚡ 强制刷新A (IDR)</button>
    </div>
  </div>
</div>

<div id="camCtrlB" class="ctrlPanel collapsed">
  <h3 onclick="togglePanel('camCtrlB')"><span class="arrow">▼</span> 📷 相机B控制</h3>
  <div class="ctrlBody" id="camBodyB"></div>
</div>

<div id="encCtrlB" class="ctrlPanel collapsed">
  <h3 onclick="togglePanel('encCtrlB')"><span class="arrow">▼</span> 🎬 相机B编码</h3>
  <div class="ctrlBody">
    <div class="ctrlRow">
      <label>码率 <span id="v_bitrateB">6</span> Mbps</label>
      <input type="range" id="s_bitrateB" min="2" max="15" step="1" value="6" oninput="onEncValB('bitrate',this.value)">
    </div>
    <div class="ctrlRow">
      <label>GOP <span id="v_gopB">15</span> 帧</label>
      <input type="range" id="s_gopB" min="5" max="60" step="1" value="15" oninput="onEncValB('gop',this.value)">
    </div>
    <div class="ctrlRow">
      <button class="toggle-btn toggle-on" onclick="forceIDRB()" style="width:100%;padding:8px">⚡ 强制刷新B (IDR)</button>
    </div>
  </div>
</div>
<div id="log"></div>

<script>
// ── Per-camera WebRTC helper ──
function Cam(id, ip){
  this.id=id; this.ip=ip;
  // Empty ip = same-origin (relative URL), non-empty = cross-origin (absolute URL)
  this.baseURL = ip ? 'http://'+ip : '';
  this.pc=null; this.sse=null; this.cQ=[];
  let self=this;

  this.setSt=function(cls,txt){
    let e=document.getElementById('st'+id);
    if(e){e.textContent=txt;e.className='camSt '+(cls||'')}
  };

  this.sseRetry=0; this.vidPoll=null;
  this.connect=function(){
    if(self.sse) self.sse.close();
    self.sse = new EventSource(self.baseURL+'/webrtc/signal');
    self.sse.onopen = ()=>{ self.setSt('','SSE OK'); };
    self.sse.onerror = ()=>{
      self.setSt('err','SSE断');
      // auto-reconnect after 2s unless we're in a good state
      setTimeout(()=>{ if(self.sse&&self.sse.readyState===EventSource.CLOSED) self.connect() },2000);
    };
    self.sse.onmessage = e => {
      try{
        let m=JSON.parse(e.data);
        if(m.type==='connected') self.createPC();
        else if(m.type==='offer') self.handleOffer(m.sdp);
        else if(m.type==='candidate') self.handleCandidate(m.candidate);
        else if(m.type==='status'&&m.state==='connected') self.setSt('ok','已连接');
      }catch(err){}
    };
  };

  this.createPC=function(){
    if(self.pc) self.pc.close();
    if(self.vidPoll) clearInterval(self.vidPoll);
    self.pc=new RTCPeerConnection({iceServers:[{urls:['stun:stun.l.google.com:19302']}]});
    self.pc.ontrack=e=>{
      if(e.track.kind==='video'){
        let v=document.getElementById('v'+id);
        v.srcObject=e.streams[0];
        v.play().catch(()=>{});
        self.setSt('','等待视频...');
        let waited=0, lastCS='';
        self.vidPoll=setInterval(()=>{
          // Check if peer is still alive
          let cs=self.pc?self.pc.connectionState:'closed';
          if(cs!==lastCS){ log('Cam'+id+' conn: '+cs); lastCS=cs; }
          if(cs==='failed'||cs==='disconnected'||cs==='closed'){
            clearInterval(self.vidPoll); self.vidPoll=null;
            self.setSt('err',cs);
            // reconnect after 2s
            setTimeout(()=>self.connect(),2000);
            return;
          }
          // Check video playback
          if(v.readyState>=2){
            clearInterval(self.vidPoll); self.vidPoll=null;
            self.setSt('ok','已连接');
            log('Cam'+id+' OK after '+waited+'ms');
            return;
          }
          v.play().catch(()=>{});
          waited+=500;
          if(waited>=5000){
            log('Cam'+id+' stuck, forcing IDR');
            if(id==='A') forceIDR(); else forceIDRB();
            waited=0;
          }
          if(waited>=30000){
            clearInterval(self.vidPoll); self.vidPoll=null;
            self.setSt('err','超时重连');
            self.connect();
          }
        },500);
      }
    };
    self.pc.oniceconnectionstatechange=()=>{
      let s=self.pc.iceConnectionState;
      if(s==='failed'||s==='disconnected') self.setSt('err',s);
    };
    self.pc.onconnectionstatechange=()=>{
      let s=self.pc.connectionState;
      log('Cam'+id+' conn: '+s);
      if(s==='failed'||s==='disconnected') self.setSt('err',s);
    };
  };

  this.handleOffer=async function(sdp){
    try{
      await self.pc.setRemoteDescription({type:'offer',sdp:sdp});
      while(self.cQ.length){let c=self.cQ.shift();try{await self.pc.addIceCandidate(new RTCIceCandidate({candidate:'a='+c,sdpMid:'0',sdpMLineIndex:0}))}catch(e){}}
      let ans=await self.pc.createAnswer();await self.pc.setLocalDescription(ans);
      await Promise.race([new Promise(r=>{if(self.pc.iceGatheringState==='complete')r();else self.pc.onicegatheringstatechange=()=>{if(self.pc.iceGatheringState==='complete')r()}}),new Promise(r=>setTimeout(r,6000))]);
      self.post({type:'answer',sdp:self.pc.localDescription.sdp});
    }catch(err){log('SDP '+self.id+': '+err)}
  };

  this.handleCandidate=function(c){
    if(!self.pc||!self.pc.remoteDescription){self.cQ.push(c);return}
    try{self.pc.addIceCandidate(new RTCIceCandidate({candidate:'a='+c,sdpMid:'0',sdpMLineIndex:0})).catch(e=>{})}catch(e){}
  };

  this.post=async function(d){
    try{await fetch(self.baseURL+'/webrtc/signal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})}catch(e){}
  };
}

// ── Global ──
// Detect own IP from page URL, pick camera B as the other P4
const MY_IP = window.location.hostname;
const CAM_B_IP = (MY_IP === '192.168.4.10') ? '192.168.4.11' : '192.168.4.10';
let camA=new Cam('A',''), camB=new Cam('B',CAM_B_IP);
// Note: Cam uses .baseURL internally; CAM_B_IP cross-origin handled by constructor
function log(m){console.log(m);let e=document.getElementById('log');if(e)e.textContent=m}

// ── Init both cameras ──
camA.connect(); camB.connect();

// Mobile: user tap forces both videos to play (autoplay policy workaround)
document.body.addEventListener('click',()=>{
  [document.getElementById('vA'),document.getElementById('vB')].forEach(v=>{
    if(v&&v.srcObject) v.play().catch(()=>{});
  });
}, {once:false});

// ── Camera A controls (host only) ──
let camDebounce={}, camCache={};
function togglePanel(id){document.getElementById(id).classList.toggle('collapsed')}

async function fetchCam(){
  try{
    let r=await fetch('/camera/status');if(!r.ok)return;let d=await r.json();
    if(!d.controls)return;
    let h='',L={exposure:'曝光时间 (×100µs)'};
    for(let c of d.controls){
      camCache[c.cid]={value:c.value,min:c.min,max:c.max,step:c.step};
      let lb=L[c.cid]||c.desc;
      h+=`<div class="ctrlRow"><label>${lb} <span id="v_${c.cid}">${c.value}</span></label><input type="range" id="s_${c.cid}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}" oninput="onCamVal('${c.cid}',this.value)"></div>`;
    }
    document.getElementById('camBody').innerHTML=h;
  }catch(e){}
}
function onCamVal(id,v){
  document.getElementById('v_'+id).textContent=v;
  if(camDebounce[id])clearTimeout(camDebounce[id]);
  camDebounce[id]=setTimeout(()=>postCam(id,parseInt(v)),150);
}
async function postCam(cid,v){
  try{
    let r=await fetch('/camera/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cid:cid,value:v})});
    let d=await r.json();
    if(d.result!=='ok'){log('Cam: '+cid+' '+d.result);
      if(camCache[cid]){document.getElementById('v_'+cid).textContent=camCache[cid].value;document.getElementById('s_'+cid).value=camCache[cid].value;}
    }else camCache[cid].value=d.value;
  }catch(e){}
}

// Encoder controls (A only)
let encDebounce={};
function onEncVal(cmd,v){
  document.getElementById('v_'+cmd).textContent=v;
  if(encDebounce[cmd])clearTimeout(encDebounce[cmd]);
  encDebounce[cmd]=setTimeout(()=>postEnc(cmd,cmd==='bitrate'?parseInt(v)*1000000:parseInt(v)),200);
}
async function postEnc(cmd,v){
  try{let r=await fetch('/encoder/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd:cmd,value:v})});let d=await r.json();if(d.result!=='ok')log('Enc: '+d.result)}catch(e){}
}
async function forceIDR(){
  try{let r=await fetch('/encoder/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd:'force_idr'})});let d=await r.json();if(d.result==='ok')log('IDR done')}catch(e){}
}
async function fetchEnc(){
  try{
    let r=await fetch('/encoder/status');if(!r.ok)return;let d=await r.json();
    if(d.bitrate){let m=d.bitrate/1000000;document.getElementById('s_bitrate').value=m;document.getElementById('v_bitrate').textContent=m}
    if(d.gop){document.getElementById('s_gop').value=d.gop;document.getElementById('v_gop').textContent=d.gop}
  }catch(e){}
}

setTimeout(fetchCam,3000);setTimeout(fetchEnc,3500);
setTimeout(fetchCamB,4000);setTimeout(fetchEncB,4500);

// ── Camera B controls (cross-origin) ──
let camDebounceB={}, camCacheB={};
const B_URL='http://'+CAM_B_IP;

async function fetchCamB(){
  try{
    let r=await fetch(B_URL+'/camera/status');if(!r.ok)return;let d=await r.json();
    if(!d.controls)return;
    let h='',L={exposure:'曝光时间 (×100µs)'};
    for(let c of d.controls){
      camCacheB[c.cid]={value:c.value,min:c.min,max:c.max,step:c.step};
      let lb=L[c.cid]||c.desc;
      h+=`<div class="ctrlRow"><label>${lb} <span id="vB_${c.cid}">${c.value}</span></label><input type="range" id="sB_${c.cid}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}" oninput="onCamValB('${c.cid}',this.value)"></div>`;
    }
    document.getElementById('camBodyB').innerHTML=h;
  }catch(e){}
}
function onCamValB(id,v){
  document.getElementById('vB_'+id).textContent=v;
  if(camDebounceB[id])clearTimeout(camDebounceB[id]);
  camDebounceB[id]=setTimeout(()=>postCamB(id,parseInt(v)),150);
}
async function postCamB(cid,v){
  try{
    let r=await fetch(B_URL+'/camera/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cid:cid,value:v})});
    let d=await r.json();
    if(d.result!=='ok'){log('CamB: '+cid+' '+d.result);
      if(camCacheB[cid]){document.getElementById('vB_'+cid).textContent=camCacheB[cid].value;document.getElementById('sB_'+cid).value=camCacheB[cid].value;}
    }else camCacheB[cid].value=d.value;
  }catch(e){}
}

// ── Encoder B controls ──
let encDebounceB={};
function onEncValB(cmd,v){
  document.getElementById('v_'+cmd+'B').textContent=v;
  if(encDebounceB[cmd])clearTimeout(encDebounceB[cmd]);
  encDebounceB[cmd]=setTimeout(()=>postEncB(cmd,cmd==='bitrate'?parseInt(v)*1000000:parseInt(v)),200);
}
async function postEncB(cmd,v){
  try{let r=await fetch(B_URL+'/encoder/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd:cmd,value:v})});let d=await r.json();if(d.result!=='ok')log('EncB: '+d.result)}catch(e){}
}
async function forceIDRB(){
  try{let r=await fetch(B_URL+'/encoder/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd:'force_idr'})});let d=await r.json();if(d.result==='ok')log('IDR B done')}catch(e){}
}
async function fetchEncB(){
  try{
    let r=await fetch(B_URL+'/encoder/status');if(!r.ok)return;let d=await r.json();
    if(d.bitrate){let m=d.bitrate/1000000;document.getElementById('s_bitrateB').value=m;document.getElementById('v_bitrateB').textContent=m}
    if(d.gop){document.getElementById('s_gopB').value=d.gop;document.getElementById('v_gopB').textContent=d.gop}
  }catch(e){}
}
</script>
</body>
</html>
